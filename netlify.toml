[build]
  publish = "dist"
  command = "pnpm build"

# Prerendering for SEO - pre-render all routes at build time
[[plugins]]
  package = "@netlify/plugin-prerender-spa"

# Auto-generate sitemap from pre-rendered pages
[[plugins]]
  package = "@netlify/plugin-sitemap"

[build.environment]
  NODE_VERSION = "18"

# SPA redirect - must be last rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
